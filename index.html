<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #555;
        }
        .subscribe-button {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .subscribe-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Обо мне</h1>
    <p>Привет! Меня зовут [Ваше имя]. Я начинающий веб-разработчик, увлекаюсь созданием сайтов и изучением новых технологий.</p>
    <p>В свободное время я люблю читать книги, заниматься спортом и путешествовать.</p>
    <button class="subscribe-button">Подписаться на новости</button>
</body>
</html>
